name: Portal scheduled jobs

# Every 5 minutes: ask the portal to (1) look for signs of an attack in its audit log and email you, and (2) send any queued client email alerts.
# Needs the PORTAL_CRON_SECRET secret (the same value as CRON_SECRET on the portal in Railway). Without it this job does nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: portal-cron
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      PORTAL_CRON_SECRET: ${{ secrets.PORTAL_CRON_SECRET }}
    steps:
      - name: Call the portal's scheduled endpoints
        run: |
          set +x
          if [ -z "$PORTAL_CRON_SECRET" ]; then echo "::notice::PORTAL_CRON_SECRET is not set: skipping. See docs/ALERTS.md."; exit 0; fi
          base="${PORTAL_URL:-https://portal.smallbuisnessdebtrecovery.com}"
          fail=0
          for job in security alerts; do
            code=$(curl -sS --max-time 60 -o body.txt -w '%{http_code}' -X POST -H "Authorization: Bearer ${PORTAL_CRON_SECRET}" "${base%/}/api/cron/${job}" || echo 000)
            echo "${job}: HTTP ${code} $(head -c 300 body.txt)"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
